<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早押しバトルアリーナDX</title>
    <style>
        /* 全体設定 */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            background-color: #1a1a1a;
        }

        .screen.active {
            display: flex;
        }

        /* --- タイトルロゴ風装飾 --- */
        .arena-title {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            margin-top: 5vh;
            color: #fff;
            text-shadow: 
                2px 2px 0px #3498db, 
                -2px -2px 0px #e91e63,
                3px -3px 0px #2ecc71,
                -3px 3px 0px #f1c40f;
            letter-spacing: 2px;
            text-align: center;
        }

        /* --- 1. モード選択画面 --- */
        #screen-mode {
            justify-content: center;
            gap: 10vh;
        }
        
        .mode-btn-container {
            display: flex;
            gap: 10vw;
        }

        .btn-box {
            padding: 20px 40px;
            border-radius: 12px;
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            font-weight: bold;
            color: white;
            border: 3px solid #fff;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .btn-box:active { transform: scale(0.95); }
        .btn-box:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-green { background-color: #2ecc71; }
        .btn-red { background-color: #e74c3c; }

        /* --- 2. 待機画面 --- */
        .wait-instruction {
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            font-weight: bold;
            margin-top: 5vh;
            margin-bottom: 3vh;
        }

        .player-status-container {
            display: flex;
            gap: 15vw;
            margin-top: 2vh;
        }

        .player-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .icon-wait {
            width: clamp(80px, 15vw, 150px);
            height: clamp(80px, 15vw, 150px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .p1-name { color: #e74c3c; font-size: clamp(1.2rem, 2.5vw, 2rem); font-weight: bold; }
        .p2-name { color: #3498db; font-size: clamp(1.2rem, 2.5vw, 2rem); font-weight: bold; }

        /* --- 手動・デバッグ入力用パネル --- */
        .manual-start-container {
            margin-top: 5vh;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .manual-inputs {
            display: flex;
            gap: 10px;
        }
        .manual-input {
            width: 100px;
            padding: 8px;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #fff;
            background-color: #333;
            color: #fff;
        }
        .manual-btn {
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            background-color: #f1c40f;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .manual-btn:active { transform: scale(0.95); }

        /* --- 3. ゲームプレイ画面 --- */
        #screen-game {
            background-image: url('https://images.unsplash.com/photo-1509316785289-025f5b846b35?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            justify-content: center;
        }

        .belt {
            width: 100%;
            padding: 40px 0;
            background: rgba(41, 128, 185, 0.8); /* 青い帯（待機） */
            text-align: center;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            z-index: 10;
            transition: background 0.1s;
        }

        /* カウントダウン用の装飾 */
        .belt.countdown {
            background: rgba(241, 196, 15, 0.9);
            font-size: clamp(4rem, 10vw, 8rem);
        }

        .belt.go {
            background: rgba(231, 76, 60, 0.9); /* 赤い帯（GO） */
            font-size: clamp(3rem, 7vw, 6rem);
            color: #fff;
        }

        /* 画面左右のタップ領域 */
        .push-area {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            z-index: 20;
            cursor: pointer;
        }
        .left-area { left: 0; }
        .right-area { right: 0; }

        /* ==================================================== */
        /* --- 4. リザルト画面（勝利演出） ------------------------ */
        /* ==================================================== */

        #screen-result {
            justify-content: flex-start;
            padding: 4vh 0;
            position: relative;
            overflow: hidden;
            background: #100f14;
            transition: background 0.6s ease;
        }

        #screen-result.theme-p1 {
            background:
                radial-gradient(circle at 50% 22%, rgba(231, 76, 60, 0.38), transparent 55%),
                #100f14;
        }
        #screen-result.theme-p2 {
            background:
                radial-gradient(circle at 50% 22%, rgba(52, 152, 219, 0.38), transparent 55%),
                #100f14;
        }
        #screen-result.theme-draw {
            background:
                radial-gradient(circle at 50% 22%, rgba(241, 196, 15, 0.28), transparent 55%),
                #100f14;
        }

        /* 回転するスポットライト光線 */
        .light-rays {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220vmax;
            height: 220vmax;
            transform: translate(-50%, -50%);
            background: repeating-conic-gradient(
                rgba(255,255,255,0.05) 0deg 6deg,
                transparent 6deg 16deg
            );
            animation: rotateRays 40s linear infinite;
            pointer-events: none;
            z-index: 0;
            opacity: 0.7;
        }
        @keyframes rotateRays {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* 紙吹雪 */
        .confetti-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        .confetti-piece {
            position: absolute;
            top: -10vh;
            width: 10px;
            height: 16px;
            opacity: 0;
            animation-name: confettiFall;
            animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation-iteration-count: 1;
            animation-fill-mode: forwards;
        }
        @keyframes confettiFall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateY(115vh) rotate(600deg); opacity: 0; }
        }

        .result-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* トロフィーバッジ */
        .trophy-badge {
            width: clamp(60px, 9vw, 90px);
            height: clamp(60px, 9vw, 90px);
            margin-bottom: 1vh;
            opacity: 0;
            transform: scale(0) rotate(-20deg);
        }
        .trophy-badge.show {
            animation: trophyPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
        }
        @keyframes trophyPop {
            0%   { opacity: 0; transform: scale(0) rotate(-20deg); }
            60%  { opacity: 1; transform: scale(1.2) rotate(6deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* 勝者バナー */
        .winner-banner {
            font-size: clamp(2.2rem, 5.5vw, 4.2rem);
            font-weight: 900;
            letter-spacing: 1px;
            text-align: center;
            opacity: 0;
            transform: translateY(-16px);
            animation: bannerIn 0.5s ease-out 0.05s forwards;
        }
        @keyframes bannerIn {
            to { opacity: 1; transform: translateY(0); }
        }
        .winner-banner.color-p1 { color: #ff6b5b; text-shadow: 0 0 18px rgba(231,76,60,0.85), 2px 2px 0 #000; }
        .winner-banner.color-p2 { color: #5dade2; text-shadow: 0 0 18px rgba(52,152,219,0.85), 2px 2px 0 #000; }
        .winner-banner.color-draw { color: #f1c40f; text-shadow: 0 0 18px rgba(241,196,15,0.7), 2px 2px 0 #000; }

        .winner-subtitle {
            margin-top: 3.5vh;
            font-size: clamp(1rem, 2vw, 1.4rem);
            font-weight: bold;
            letter-spacing: 3px;
            opacity: 0.75;
            text-align: center;
        }
        .winner-subtitle.color-p1 { color: #ff8a7a; }
        .winner-subtitle.color-p2 { color: #7fc4ec; }
        .winner-subtitle.color-draw { color: #f7dc6f; }

        /* プレイヤーカード */
        .players-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(1rem, 4vw, 3rem);
            margin-top: 3vh;
            width: 90%;
            max-width: 900px;
        }

        .vs-text {
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            font-weight: 900;
            color: rgba(255,255,255,0.35);
            flex-shrink: 0;
        }

        .player-card {
            flex: 1;
            max-width: 320px;
            position: relative;
            padding: clamp(1.2rem, 2.5vw, 2rem) 1rem 1.6rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(24px) scale(0.96);
            animation: cardIn 0.5s ease-out 0.25s forwards;
            transition: border-color 0.4s, box-shadow 0.4s, transform 0.4s, opacity 0.4s;
        }
        .player-card.card-p2 { animation-delay: 0.35s; }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .player-card.is-winner {
            border-color: currentColor;
            box-shadow: 0 0 25px currentColor, 0 0 55px currentColor;
            animation: cardIn 0.5s ease-out forwards, winnerGlow 1.8s ease-in-out 0.9s infinite;
            transform: translateY(0) scale(1.06);
        }
        @keyframes winnerGlow {
            0%, 100% { box-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }
            50%      { box-shadow: 0 0 32px currentColor, 0 0 70px currentColor; }
        }
        .player-card.is-loser {
            opacity: 0.55;
            filter: grayscale(35%);
            transform: translateY(0) scale(0.94);
        }
        .player-card.color-p1 { color: #e74c3c; }
        .player-card.color-p2 { color: #3498db; }

        .card-ribbon {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #f1c40f;
            color: #1a1a1a;
            font-size: 0.85rem;
            font-weight: 900;
            padding: 4px 16px;
            border-radius: 999px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            white-space: nowrap;
        }
        .card-ribbon.show {
            animation: ribbonPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.75s forwards;
        }
        @keyframes ribbonPop {
            to { transform: translateX(-50%) scale(1); }
        }

        .card-name {
            font-size: clamp(1.1rem, 2.2vw, 1.5rem);
            font-weight: bold;
            margin-bottom: 0.6rem;
        }

        .time-text {
            font-size: clamp(2.2rem, 5.5vw, 3.6rem);
            font-weight: 900;
            color: #fff;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }
        .time-label {
            margin-top: 6px;
            font-size: clamp(0.85rem, 1.6vw, 1.1rem);
            font-weight: bold;
            color: rgba(255,255,255,0.6);
            text-align: center;
        }

        .chip-box {
            margin-top: 1.1rem;
            padding-top: 1rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 1px dashed rgba(255,255,255,0.15);
        }
        .chip-icon {
            width: 26px;
            height: 26px;
            margin-bottom: 4px;
        }
        .chip-icon.spin { animation: coinSpin 1.1s ease-in-out 1; }
        @keyframes coinSpin {
            0%   { transform: rotateY(0deg); }
            100% { transform: rotateY(1080deg); }
        }
        .chip-text {
            font-size: clamp(1.3rem, 2.6vw, 1.8rem);
            font-weight: 900;
        }
        .chip-text.chip-plus  { color: #2ecc71; text-shadow: 0 0 12px rgba(46,204,113,0.6); }
        .chip-text.chip-minus { color: #ff6b5b; }
        .chip-text.chip-zero  { color: #ecf0f1; }

        /* 戻るボタン */
        .reset-btn {
            margin-top: 4vh;
            padding: 14px 42px;
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: clamp(1rem, 1.8vw, 1.25rem);
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            z-index: 2;
        }
        .reset-btn:hover { background: rgba(255,255,255,0.15); border-color: #fff; }
        .reset-btn:active { transform: scale(0.96); }
        .reset-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    </style>
</head>
<body>

<!-- SCREEN 1: モード選択 -->
    <div id="screen-mode" class="screen active">
        <div class="arena-title">早押しバトルアリーナDX</div>
        <div class="mode-btn-container">
            <button class="btn-box btn-green" onclick="selectMode('normal')">通常モード<br><span style="font-size: 0.6em;">(左のボタン)</span></button>
            <button class="btn-box btn-red" onclick="selectMode('casino')">カジノモード<br><span style="font-size: 0.6em;">(右のボタン)</span></button>
        </div>
    </div>

    <!-- SCREEN 2: 待機画面 -->
    <div id="screen-wait" class="screen">
        <div class="arena-title">早押しバトルアリーナDX</div>
        <div class="wait-instruction">QRコードをスタッフに提示してください</div>
        
        <div class="player-status-container">
            <div class="player-status">
                <div id="icon-p1" class="icon-wait">
                    <!-- 初期：青い点々 -->
                    <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none">
                        <circle cx="5" cy="12" r="3" fill="#3498db"/>
                        <circle cx="12" cy="12" r="3" fill="#3498db"/>
                        <circle cx="19" cy="12" r="3" fill="#3498db"/>
                    </svg>
                </div>
                <div class="p1-name">Player1 (Aキー)</div>
            </div>
            <div class="player-status">
                <div id="icon-p2" class="icon-wait">
                    <!-- 初期：青い点々 -->
                    <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none">
                        <circle cx="5" cy="12" r="3" fill="#3498db"/>
                        <circle cx="12" cy="12" r="3" fill="#3498db"/>
                        <circle cx="19" cy="12" r="3" fill="#3498db"/>
                    </svg>
                </div>
                <div class="p2-name">Player2 (Lキー)</div>
            </div>
        </div>
        
        <div style="margin-top: 3vh; color: #888;">(DBの登録状況を自動監視しています...)</div>

        <!-- デバッグ・手動強制スタート用パネル -->
        <div class="manual-start-container">
            <div style="font-size: 1rem; font-weight: bold; color: #f1c40f;">【手動入力 / 強制スタート】</div>
            <div class="manual-inputs">
                <input type="number" id="manual-p1-id" class="manual-input" placeholder="P1 ID">
                <input type="number" id="manual-p2-id" class="manual-input" placeholder="P2 ID">
                <button class="manual-btn" onclick="forceStart()">開始</button>
            </div>
            <div style="font-size: 0.8rem; color: #ccc; margin-top: 5px;">
                ※待機中にキーボードの <b>A</b> と <b>L</b> を押すことでも強制開始できます。
            </div>
        </div>
    </div>

    <!-- SCREEN 3: ゲームプレイ画面 -->
    <div id="screen-game" class="screen">
        <!-- 画面の左右タップで反応 -->
        <div class="push-area left-area" onmousedown="handlePush(1)" ontouchstart="handlePush(1)"></div>
        <div class="push-area right-area" onmousedown="handlePush(2)" ontouchstart="handlePush(2)"></div>
        
        <div id="game-belt" class="belt">
            曲が止まったら押せ
        </div>
    </div>

    <!-- SCREEN 4: リザルト画面 -->
    <div id="screen-result" class="screen">
        <div class="light-rays"></div>
        <div class="confetti-layer" id="confetti-layer"></div>

        <div class="result-content">
            <svg id="trophy-badge" class="trophy-badge" viewBox="0 0 64 64" fill="none">
                <path d="M18 10H46V26C46 34.8366 39.0589 42 30.5 42H33.5C24.9411 42 18 34.8366 18 26V10Z" fill="#f1c40f" stroke="#d4a90c" stroke-width="2"/>
                <path d="M18 14H9C9 22 13 27 18 28" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
                <path d="M46 14H55C55 22 51 27 46 28" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
                <rect x="28" y="41" width="8" height="9" fill="#f1c40f"/>
                <rect x="20" y="50" width="24" height="6" rx="2" fill="#f1c40f"/>
                <rect x="24" y="50" width="16" height="6" rx="2" fill="#d4a90c" opacity="0.5"/>
            </svg>

            <div id="result-title-top" class="winner-banner">Player1の勝利</div>

            <div class="players-row">
                <div id="card-p1" class="player-card color-p1">
                    <div id="ribbon-p1" class="card-ribbon">WINNER</div>
                    <div class="card-name">Player1</div>
                    <div id="time-p1" class="time-text">0.100s</div>
                    <div class="time-label">反応するまでの時間</div>
                    <div id="chipbox-p1" class="chip-box" style="display:none;">
                        <svg class="chip-icon" id="chipicon-p1" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" fill="#f1c40f" stroke="#d4a90c" stroke-width="1.5"/>
                            <circle cx="12" cy="12" r="6.5" fill="none" stroke="#d4a90c" stroke-width="1"/>
                        </svg>
                        <div id="chip-p1" class="chip-text">+10 チップ</div>
                    </div>
                </div>

                <div class="vs-text">VS</div>

                <div id="card-p2" class="player-card color-p2">
                    <div id="ribbon-p2" class="card-ribbon">WINNER</div>
                    <div class="card-name">Player2</div>
                    <div id="time-p2" class="time-text">0.400s</div>
                    <div class="time-label">反応するまでの時間</div>
                    <div id="chipbox-p2" class="chip-box" style="display:none;">
                        <svg class="chip-icon" id="chipicon-p2" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" fill="#f1c40f" stroke="#d4a90c" stroke-width="1.5"/>
                            <circle cx="12" cy="12" r="6.5" fill="none" stroke="#d4a90c" stroke-width="1"/>
                        </svg>
                        <div id="chip-p2" class="chip-text">-10 チップ</div>
                    </div>
                </div>
            </div>

            <div id="result-title-bottom" class="winner-subtitle">GREAT REACTION</div>

            <button class="reset-btn" onclick="resetToTitle(this)">タイトルへ戻る<br><span style="font-size: 0.7em;">(ボタンを同時押し)</span></button>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://welbnkxi.vercel.app';
        const CHECK_MARK_SVG = `
            <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>`;
        
        let gameMode = 'normal'; // 'normal' | 'casino'
        let pollTimer = null;
        let gameData = null;

        // ゲーム進行用変数
        let gameState = 'init';  // 'init' | 'countdown' | 'ready' | 'go' | 'result'
        let startTime = 0;
        let p1Time = null;
        let p2Time = null;
        let goTimeoutId = null;
        let endTimerId = null;
        
        let debugP1Ready = false;
        let debugP2Ready = false;

        // ↓追加：リザルト画面での「戻る承認」フラグ
        let resultP1Approved = false;
        let resultP2Approved = false;
        const bgm = new Audio('assets/aitu.mp3');
        const winSound = new Audio('assets/tappu.mp3');    
        const pushSound = new Audio('assets/shot.mp3');    
        const btnSound = new Audio('assets/ok.mp3');   

        function playSound(audioObj) {
            try {
                if (!audioObj) return;
                audioObj.currentTime = 0; 
                audioObj.play();
            } catch (e) {
                console.error("音声再生エラー:", e);
            }
        }

        bgm.loop = true;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- 1. モード選択と待機 ---
        function selectMode(mode) {
            gameMode = mode;
            // ユーザー操作きっかけでオーディオをアンロック
            try { 
                bgm.play().then(() => bgm.pause()); 
                winSound.play().then(() => winSound.pause());
                btnSound.play().then(() => btnSound.pause());
                pushSound.play().then(() => pushSound.pause());
            } catch(e) {}
                    
            playSound(btnSound);

            if (mode === 'normal') {
                // 通常モードはIDの認証・待機なしですぐ開始(カウントダウンへ)
                gameData = null;
                startGame();
            } else {
                showScreen('screen-wait');
                startPolling();
            }
        }

        function startPolling() {
            pollTimer = setInterval(async () => {
                try {
                    const res = await fetch(`${API_BASE_URL}/api/game/HAYAOSHI`);
                    if (res.ok) {
                        const data = await res.json();
                        gameData = data;
                        updateWaitUI(data);

                        if (data.status === 'playing') {
                            clearInterval(pollTimer);
                            setTimeout(startGame, 1000); 
                        }
                    }
                } catch (error) {
                    console.error("DB監視エラー:", error);
                }
            }, 1500);
        }

        function updateWaitUI(data) {
            const p1Occupied = data.p1_id !== null || data.p1_skipped;
            const p2Occupied = data.p2_id !== null || data.p2_skipped;
            
            if (p1Occupied) document.getElementById('icon-p1').innerHTML = CHECK_MARK_SVG;
            if (p2Occupied) document.getElementById('icon-p2').innerHTML = CHECK_MARK_SVG;
        }

        function forceStart() {
            playSound(btnSound); 
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }

            const p1Val = document.getElementById('manual-p1-id').value;
            const p2Val = document.getElementById('manual-p2-id').value;

            gameData = {
                p1_id: p1Val ? Number(p1Val) : null,
                p2_id: p2Val ? Number(p2Val) : null,
                p1_skipped: !p1Val,
                p2_skipped: !p2Val,
                status: 'playing'
            };

            updateWaitUI(gameData);
            setTimeout(startGame, 500); 
        }

        // キーの同時押しを判定するための変数
        const keysPressed = {};

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keysPressed[key] = true;

            if (document.getElementById('screen-mode').classList.contains('active')) {
                if (key === 'a') selectMode('normal');
                else if (key === 'l') selectMode('casino');
            }
            else if (document.getElementById('screen-wait').classList.contains('active')) {
                let changed = false;
                if (key === 'a' && !debugP1Ready) {
                    debugP1Ready = true;
                    document.getElementById('icon-p1').innerHTML = CHECK_MARK_SVG;
                    changed = true;
                }
                if (key === 'l' && !debugP2Ready) {
                    debugP2Ready = true;
                    document.getElementById('icon-p2').innerHTML = CHECK_MARK_SVG;
                    changed = true;
                }

                if (changed && debugP1Ready && debugP2Ready) {
                    setTimeout(forceStart, 500);
                }
            }
            else if (gameState === 'ready' || gameState === 'go') {
                if (key === 'a') handlePush(1);
                if (key === 'l') handlePush(2);
            }
            else if (gameState === 'result' && document.getElementById('screen-result').classList.contains('active')) {
                if (key === 'a') resultP1Approved = true;
                if (key === 'l') resultP2Approved = true;

                if (resultP1Approved && resultP2Approved) {
                    const resetBtn = document.querySelector('.reset-btn');
                    if (resetBtn && !resetBtn.disabled) {
                        resetToTitle(resetBtn);
                    }
                }
}
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keysPressed[key] = false; 
        });

        // --- 2. ゲームプレイ開始 (カウントダウン追加) ---
        function startGame() {
            showScreen('screen-game');
            gameState = 'countdown';
            p1Time = null;
            p2Time = null;
            debugP1Ready = false;
            debugP2Ready = false;
            
            const belt = document.getElementById('game-belt');
            let count = 5;
            belt.className = 'belt countdown';
            belt.innerText = count;

            const countDownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    belt.innerText = count;
                } else {
                    clearInterval(countDownInterval);
                    startReadyPhase();
                }
            }, 1000);
        }

        // BGM開始と早押し待機フェーズ
        function startReadyPhase() {
            gameState = 'ready';
            const belt = document.getElementById('game-belt');
            belt.className = 'belt';
            belt.innerText = '曲が止まったら押せ';

            try { 
                bgm.currentTime = 0;
                bgm.play(); 
            } catch(e) {} 

            // 3秒〜7秒のランダムなタイミングで「GO」
            const waitTime = Math.random() * 4000 + 3000;
            goTimeoutId = setTimeout(() => {
                gameState = 'go';
                try { bgm.pause(); } catch(e) {} 
                
                belt.className = 'belt go';
                belt.innerText = '押せ！！！';
                startTime = performance.now();
            }, waitTime);
        }

        // スマホ画面タップ用
        function handlePush(playerNum) {
            // カウントダウン中などの準備期間はタップ・キー入力を無視
            if (gameState !== 'ready' && gameState !== 'go') return;

            playSound(pushSound);
            if (gameState === 'ready') {
                // フライング
                clearTimeout(goTimeoutId);
                try { bgm.pause(); } catch(e) {}
                
                if (playerNum === 1) p1Time = -1; 
                if (playerNum === 2) p2Time = -1;
                
                processResult();

            } else if (gameState === 'go') {
                // 正常な押し
                const timeStr = ((performance.now() - startTime) / 1000);
                if (playerNum === 1 && p1Time === null) p1Time = timeStr;
                if (playerNum === 2 && p2Time === null) p2Time = timeStr;

                if (p1Time !== null && p2Time !== null) {
                    if (endTimerId) clearTimeout(endTimerId);
                    processResult();
                } else {
                    if (!endTimerId) {
                        endTimerId = setTimeout(processResult, 1000);
                    }
                }
            }
        }

        function launchConfetti(themeColor) {
            const layer = document.getElementById('confetti-layer');
            layer.innerHTML = '';

            const palettes = {
                p1:   ['#e74c3c', '#ff8a7a', '#f1c40f', '#ffffff'],
                p2:   ['#3498db', '#7fc4ec', '#f1c40f', '#ffffff'],
                draw: ['#f1c40f', '#f7dc6f', '#ffffff', '#bdc3c7']
            };
            const colors = palettes[themeColor] || palettes.draw;
            const pieceCount = 70;

            for (let i = 0; i < pieceCount; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                const left = Math.random() * 100;
                const duration = 2.4 + Math.random() * 2;
                const delay = Math.random() * 0.6;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const isCircle = Math.random() > 0.5;

                piece.style.left = left + 'vw';
                piece.style.background = color;
                piece.style.borderRadius = isCircle ? '50%' : '2px';
                piece.style.animationDuration = duration + 's';
                piece.style.animationDelay = delay + 's';
                piece.style.width = (6 + Math.random() * 6) + 'px';
                piece.style.height = (isCircle ? piece.style.width : (10 + Math.random() * 8) + 'px');

                layer.appendChild(piece);
            }
        }

        function animateCountUp(elementId, targetSeconds) {
            const el = document.getElementById(elementId);
            const duration = 550;
            const start = performance.now();

            function tick(now) {
                const progress = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = targetSeconds * eased;
                el.innerText = current.toFixed(3) + 's';
                if (progress < 1) {
                    requestAnimationFrame(tick);
                } else {
                    el.innerText = targetSeconds.toFixed(3) + 's';
                }
            }
            requestAnimationFrame(tick);
        }

        // --- 3. 勝敗と結果表示 ---
        function processResult() {
            gameState = 'result';
            
            let winner = 0; 
            let p1Display = "";
            let p2Display = "";
            let p1IsNumber = false, p2IsNumber = false;

            if (p1Time === -1 && p2Time !== -1) {
                winner = 2; p1Display = "フライング"; p2Display = (p2Time === null) ? "-" : p2Time.toFixed(3) + "s";
                p2IsNumber = (p2Time !== null);
            } else if (p2Time === -1 && p1Time !== -1) {
                winner = 1; p2Display = "フライング"; p1Display = (p1Time === null) ? "-" : p1Time.toFixed(3) + "s";
                p1IsNumber = (p1Time !== null);
            } else if (p1Time === -1 && p2Time === -1) {
                winner = 0; p1Display = "フライング"; p2Display = "フライング";
            } else {
                if (p1Time === null) p1Display = "時間切れ"; else { p1Display = p1Time.toFixed(3) + "s"; p1IsNumber = true; }
                if (p2Time === null) p2Display = "時間切れ"; else { p2Display = p2Time.toFixed(3) + "s"; p2IsNumber = true; }

                if (p1Time !== null && (p2Time === null || p1Time < p2Time)) winner = 1;
                else if (p2Time !== null && (p1Time === null || p2Time < p1Time)) winner = 2;
                else winner = 0;
            }

            const screenResult = document.getElementById('screen-result');
            const titleTop = document.getElementById('result-title-top');
            const titleBot = document.getElementById('result-title-bottom');
            const trophy = document.getElementById('trophy-badge');
            const cardP1 = document.getElementById('card-p1');
            const cardP2 = document.getElementById('card-p2');
            const ribbonP1 = document.getElementById('ribbon-p1');
            const ribbonP2 = document.getElementById('ribbon-p2');

            screenResult.classList.remove('theme-p1', 'theme-p2', 'theme-draw');
            cardP1.classList.remove('is-winner', 'is-loser');
            cardP2.classList.remove('is-winner', 'is-loser');
            ribbonP1.classList.remove('show');
            ribbonP2.classList.remove('show');
            trophy.classList.remove('show');

            let themeKey = 'draw';
            const catchphrases = {
                1: ['神速の反応！', 'まさに一瞬の勝負！', '完璧なタイミング！'],
                2: ['神速の反応！', 'まさに一瞬の勝負！', '完璧なタイミング！'],
                0: ['同時押し!? 奇跡の一戦！', '実力伯仲の名勝負！']
            };

            if (winner === 1) {
                themeKey = 'p1';
                titleTop.innerText = "Player1の勝利";
                titleTop.className = "winner-banner color-p1";
                titleBot.innerText = catchphrases[1][Math.floor(Math.random() * catchphrases[1].length)];
                titleBot.className = "winner-subtitle color-p1";
                cardP1.classList.add('is-winner');
                cardP2.classList.add('is-loser');
                ribbonP1.classList.add('show');
                trophy.classList.add('show');
            } else if (winner === 2) {
                themeKey = 'p2';
                titleTop.innerText = "Player2の勝利";
                titleTop.className = "winner-banner color-p2";
                titleBot.innerText = catchphrases[2][Math.floor(Math.random() * catchphrases[2].length)];
                titleBot.className = "winner-subtitle color-p2";
                cardP2.classList.add('is-winner');
                cardP1.classList.add('is-loser');
                ribbonP2.classList.add('show');
                trophy.classList.add('show');
            } else {
                themeKey = 'draw';
                titleTop.innerText = "引き分け";
                titleTop.className = "winner-banner color-draw";
                titleBot.innerText = catchphrases[0][Math.floor(Math.random() * catchphrases[0].length)];
                titleBot.className = "winner-subtitle color-draw";
            }
            screenResult.classList.add('theme-' + themeKey);

            try {
                winSound.currentTime = 0; 
                winSound.play();
            } catch(e) {
                console.error("効果音の再生エラー:", e);
            }

            const timeP1El = document.getElementById('time-p1');
            const timeP2El = document.getElementById('time-p2');
            if (p1IsNumber) { animateCountUp('time-p1', p1Time); } else { timeP1El.innerText = p1Display; }
            if (p2IsNumber) { animateCountUp('time-p2', p2Time); } else { timeP2El.innerText = p2Display; }

            const chipboxP1 = document.getElementById('chipbox-p1');
            const chipboxP2 = document.getElementById('chipbox-p2');
            if (gameMode === 'casino') {
                chipboxP1.style.display = 'flex';
                chipboxP2.style.display = 'flex';
                let p1Delta = 0, p2Delta = 0;
                
                if (winner === 1) { p1Delta = 10; p2Delta = -10; }
                else if (winner === 2) { p1Delta = -10; p2Delta = 10; }

                setChipUI('chip-p1', 'chipicon-p1', p1Delta);
                setChipUI('chip-p2', 'chipicon-p2', p2Delta);

                if (winner !== 0) {
                    if (gameData && gameData.p1_id) sendChipDelta(gameData.p1_id, p1Delta);
                    if (gameData && gameData.p2_id) sendChipDelta(gameData.p2_id, p2Delta);
                }
            } else {
                chipboxP1.style.display = 'none';
                chipboxP2.style.display = 'none';
            }

            launchConfetti(themeKey);
            resultP1Approved = false;   // ←追加
            resultP2Approved = false;   // ←追加
            showScreen('screen-result');
        }

        function setChipUI(textId, iconId, delta) {
            const el = document.getElementById(textId);
            const icon = document.getElementById(iconId);
            icon.classList.remove('spin');
            void icon.offsetWidth; 
            icon.classList.add('spin');

            if (delta > 0) {
                el.innerText = `+${delta} チップ`;
                el.className = 'chip-text chip-plus';
            } else if (delta < 0) {
                el.innerText = `${delta} チップ`;
                el.className = 'chip-text chip-minus';
            } else {
                el.innerText = `変動なし`;
                el.className = 'chip-text chip-zero';
            }
        }

        async function sendChipDelta(playerId, delta) {
            try {
                await fetch(`${API_BASE_URL}/api/chips`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playerId: Number(playerId), delta: delta })
                });
            } catch (e) {
                console.error("チップ更新エラー:", e);
            }
        }

        // --- 4. DBのリセットとタイトルへの帰還 ---
        async function resetToTitle(btn) {
            playSound(btnSound); 
            btn.disabled = true;
            btn.innerText = "リセット中...";
            
            // 通常モードの場合はAPIリセットを省略し、カジノモードのみDBへリセット要求を送る
            if (gameMode === 'casino') {
                try {
                    await fetch(`${API_BASE_URL}/api/reset`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ game_id: 'HAYAOSHI' })
                    });
                } catch (e) {
                    console.error("DBリセットエラー:", e);
                }
            }
            
            location.reload(); 
        }
    </script>
</body>
</html>
